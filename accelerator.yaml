accelerator:
  displayName: Jupyter Utilities Accelerator
  description: Utilities for deploying and extending JupyterHub notebooks
  iconUrl: https://cdn.icon-icons.com/icons2/2667/PNG/512/jupyter_app_icon_161280.png
  tags:
    - "ML"
    - "AI"
    - "notebooks"
    - "datascience"
    - "jupyter"
  options:
    - name: jupyter
      inputType: radio
      display: true
      choices:
        - text: 'Jupyter (ML Notebook / Experimentation)'
          value: selected
      defaultValue: selected
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: mlPlatformType
      inputType: radio
      display: true
      choices:
        - text: 'View guidance manual: https://github.com/bitnami/charts/tree/main/bitnami/jupyterhub'
          value: notebook
      defaultValue: notebook
    - name: singleuserImageRegistry
      inputType: text
      display: true
      label: 'singleuser.image.registry'
      defaultValue: 'docker.io'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserImageRepository
      inputType: text
      display: true
      label: 'singleuser.image.repository'
      defaultValue: 'jupyter/tensorflow-notebook'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserImageTag
      inputType: text
      display: true
      label: 'singleuser.image.tag'
      defaultValue: 'python-3.11'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserImagePullPolicy
      inputType: text
      display: true
      label: 'singleuser.image.pullPolicy'
      defaultValue: 'Always'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserImageCommand
      inputType: text
      display: true
      label: 'singleuser.image.command'
      defaultValue: 'start-notebook.py'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserContainersecuritycontextRunAsuser
      inputType: text
      display: true
      label: 'singleuser.containerSecurityContext.runAsUser'
      defaultValue: '1000'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserContainersecuritycontextRunAsgroup
      inputType: text
      display: true
      label: 'singleuser.containerSecurityContext.runAsGroup'
      defaultValue: '100'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserPodsecuritycontextRunAsuser
      inputType: text
      display: true
      label: 'singleuser.podSecurityContext.runAsUser'
      defaultValue: '1000'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: singleuserPodsecuritycontextRunAsgroup
      inputType: text
      display: true
      label: 'singleuser.podSecurityContext.runAsGroup'
      defaultValue: '100'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: proxyServicePublicType
      inputType: text
      display: true
      label: 'proxy.service.public.type'
      defaultValue: 'LoadBalancer'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: proxyServicePublicPortsHttp
      inputType: text
      display: true
      label: 'proxy.service.public.ports.http'
      defaultValue: '8009'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: proxyIngressAnnotationsIngressEnabled
      inputType: text
      display: true
      label: 'proxy.ingress.annotations.ingress.enabled'
      defaultValue: 'true'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: proxyIngressAnnotationsWebsocketRoutes
      inputType: text
      display: true
      label: 'proxy.ingress.annotations.websocket.routes'
      defaultValue: '/'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: proxyIngressAnnotationsTls
      inputType: text
      display: true
      label: 'proxy.ingress.annotations.tls'
      defaultValue: 'true'
      dependsOn:
        name: mlPlatformType
        value: notebook
    - name: proxyIngressAnnotationsSelfSigned
      inputType: text
      display: true
      label: 'proxy.ingress.annotations.self.signed'
      defaultValue: 'contour'
      dependsOn:
        name: mlPlatformType
        value: notebook
engine:
  type: Merge
  sources:
    - type: Chain
      transformations:
        - type: Include
          patterns: [ 'resources/**.yaml' ]
        - type: ReplaceText
          substitutions:
            - text: REPLACE_SINGLEUSER_IMAGE_REGISTRY
              with: "#singleuserImageRegistry"
            - text: REPLACE_SINGLEUSER_IMAGE_REPOSITORY
              with: "#singleuserImageRepository"
            - text: REPLACE_SINGLEUSER_IMAGE_TAG
              with: "#singleuserImageTag"
            - text: REPLACE_SINGLEUSER_IMAGE_PULLPOLICY
              with: "#singleuserImagePullPolicy"
            - text: REPLACE_SINGLEUSER_IMAGE_COMMAND
              with: "#singleuserImageCommand"
            - text: REPLACE_SINGLEUSER_CONTAINER_SECURITY_CONTEXT_RUNASUSER
              with: "#singleuserContainersecuritycontextRunAsuser"
            - text: REPLACE_SINGLEUSER_CONTAINER_SECURITY_CONTEXT_RUNASGROUP
              with: "#singleuserContainersecuritycontextRunAsgroup"
            - text: REPLACE_SINGLEUSER_POD_SECURITY_CONTEXT_RUNASUSER
              with: "#singleuserPodsecuritycontextRunAsuser"
            - text: REPLACE_SINGLEUSER_POD_SECURITY_CONTEXT_RUNASGROUP
              with: "#singleuserPodsecuritycontextRunAsgroup"
            - text: REPLACE_PROXY_SERVICE_PUBLIC_TYPE
              with: "#proxyServicePublicType"
            - text: REPLACE_PROXY_SERVICE_PUBLIC_PORTS_HTTP
              with: "#proxyServicePublicPortsHttp"
            - text: REPLACE_PROXY_INGRESS_ANNOTATIONS_INGRESS_ENABLED
              with: "#proxyIngressAnnotationsIngressEnabled"
            - text: REPLACE_PROXY_INGRESS_ANNOTATIONS_WEBSOCKET_ROUTES
              with: "#proxyIngressAnnotationsWebsocketRoutes"
            - text: REPLACE_PROXY_INGRESS_ANNOTATIONS_TLS
              with: "#proxyIngressAnnotationsTls"
            - text: REPLACE_PROXY_INGRESS_ANNOTATIONS_SELF_SIGNED
              with: "#proxyIngressAnnotationsSelfSigned"



